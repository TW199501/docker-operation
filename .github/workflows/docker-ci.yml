name: Docker Build & Test

# =============================================================================
# 對齊團隊範本(team-project-template/.github/workflows/ci.yml)
# - concurrency 取消同分支舊 workflow
# - 最小 permissions
# - basics job:Conventional Commits / line-ending / 大檔偵測
# - 移除與 security-scan.yml 重複的 Trivy job
# - 移除與 script-test.yml 重複的 shellcheck job
# =============================================================================

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/Dockerfile'
      - '**/docker-compose.yml'
      - '**/docker-compose.yaml'
      - '**/*.sh'
      - '.github/workflows/**'        # workflow 自己改動也要觸發
      - '.github/scripts/**'          # CI script 改動觸發
      - '**/.env.example'             # env 規範改動觸發
  pull_request:
    branches: [ main ]
    paths:
      - '**/Dockerfile'
      - '**/docker-compose.yml'
      - '**/docker-compose.yaml'
      - '**/*.sh'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '**/.env.example'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # 基礎檢查:commit message / line endings / 大檔
  # ---------------------------------------------------------------------------
  basics:
    name: Basics (commit / file check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages (Conventional Commits)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: webiny/action-conventional-commits@v1.3.0

      - name: Setup Node.js (for check scripts)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check line endings (LF enforcement)
        run: node .github/scripts/check-line-endings.mjs

      - name: Check for large files (> 5MB)
        run: |
          LARGE_FILES=$(find . -type f -size +5M -not -path "./.git/*" || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "發現大檔案(>5MB),請考慮使用 Git LFS:"
            echo "$LARGE_FILES"
            exit 1
          fi

      - name: Check docker-compose file naming convention (advisory)
        # 規範來源:docs/conventions/compose-naming.md
        # 目前 warn-only(continue-on-error: true),待 6 個違規檔處理完後轉強制
        continue-on-error: true
        run: |
          BAD=$(find . -type f \
                  \( -name "compose-*.yml" -o -name "compose-*.yaml" \
                     -o -name "*-compose.yml" -o -name "*-compose.yaml" \
                     -o -name "docker-compose-*.yml" -o -name "docker-compose-*.yaml" \) \
                  -not -path "./.git/*" || true)
          if [ -n "$BAD" ]; then
            echo "::warning::以下 compose 檔不符合團隊命名規範(見 docs/conventions/compose-naming.md):"
            echo "$BAD" | while read -r f; do echo "::warning::  $f"; done
            echo "::warning::規範:docker-compose.<env>.yml 或 docker-compose.<purpose>.yml(點分隔,不用 dash)"
          else
            echo "✅ 所有 compose 檔皆符合命名規範"
          fi

      - name: Block .env and secret files (must not be committed)
        # 規範來源:team-project-template/docs/rule/development-guidelines.md §九
        # 規範:.env / *.pem / *.key / *.pfx 一律禁止進 Git;唯一例外是 .env.example
        # 機密外洩 zero-tolerance,不設 continue-on-error
        run: |
          BAD=$(git ls-files \
                | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.pfx$' \
                | grep -vE '\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::偵測到禁止進 Git 的機密/環境檔:"
            echo "$BAD" | while read -r f; do echo "::error::  $f"; done
            echo "::error::"
            echo "::error::處理方式:"
            echo "::error::  1. git rm --cached <檔案>"
            echo "::error::  2. 將檔案中的秘密 revoke + 重設(視為已洩漏)"
            echo "::error::  3. .env 改放 .env.example 留範例,實際值由部署環境注入"
            exit 1
          fi
          echo "✅ 無禁止檔案進 Git"

      - name: Block secrets in newly added files (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # 只檢查本 PR 新增的檔案,避免歷史包袱誤殺
          ADDED=$(git diff --name-only --diff-filter=A \
                    "${{ github.event.pull_request.base.sha }}" \
                    "${{ github.event.pull_request.head.sha }}" || true)
          BAD=$(echo "$ADDED" \
                | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.pfx$' \
                | grep -vE '\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::本 PR 新增了禁止進 Git 的機密/環境檔:"
            echo "$BAD" | while read -r f; do echo "::error::  $f"; done
            exit 1
          fi
          echo "✅ 本 PR 未新增機密檔案"

  # ---------------------------------------------------------------------------
  # Dockerfile lint(Hadolint)
  # ---------------------------------------------------------------------------
  docker-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Dockerfiles
        id: dockerfiles
        run: |
          echo "dockerfiles=$(find . -name "Dockerfile" -type f | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Run Docker lint
        if: steps.dockerfiles.outputs.dockerfiles != ''
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Docker Compose 語法驗證
  # ---------------------------------------------------------------------------
  docker-compose-validate:
    name: docker-compose config validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Validate docker-compose files
        run: |
          find . -name "docker-compose*.yml" -o -name "docker-compose*.yaml" | while read -r file; do
            echo "Validating $file"
            docker-compose -f "$file" config --quiet || echo "Warning: $file has issues"
          done

  # ---------------------------------------------------------------------------
  # 構建測試
  # ---------------------------------------------------------------------------
  build-test:
    name: Build test
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'Dockerfile') || contains(github.event.head_commit.modified, 'docker-compose')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Docker Compose files
        run: |
          echo "Found docker-compose files:"
          find . -name "docker-compose*.yml" -o -name "docker-compose*.yaml" | head -5

      - name: Test docker-compose config
        run: |
          for file in $(find . -name "docker-compose*.yml" -o -name "docker-compose*.yaml" | head -3); do
            echo "Testing $file..."
            docker-compose -f "$file" config --quiet && echo "✅ $file is valid" || echo "❌ $file has issues"
          done

      - name: Check for any Dockerfiles
        run: |
          if [ -f "Dockerfile" ]; then
            echo "Found Dockerfile in root directory"
            docker build --no-cache -t test-image .
            echo "✅ Dockerfile build successful"
          else
            echo "No Dockerfile found in root directory, skipping build test"
          fi

  # ---------------------------------------------------------------------------
  # 版本一致性
  # ---------------------------------------------------------------------------
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          if [ -f "Dockerfile/VERSION" ]; then
            VERSION=$(cat Dockerfile/VERSION)
            echo "Current version: $VERSION"
            if grep -q "$VERSION" README.md; then
              echo "Version found in README.md"
            else
              echo "Warning: Version not found in README.md"
            fi
          fi
