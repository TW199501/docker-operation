name: 💡 功能請求
description: 提出新功能或改進建議
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你的建議！請完整描述需求，方便團隊評估與排程。

  - type: textarea
    id: problem
    attributes:
      label: 🎯 要解決什麼問題？
      description: 描述目前的痛點或不便（不要直接寫解決方案）
      placeholder: 目前批次匯出發票需手動逐筆下載，每月處理 2000+ 筆耗時極長
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 建議的解決方案
      description: 描述你想到的解決方式
      placeholder: 新增「批次匯出」功能，可選日期區間一次下載所有發票
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 替代方案
      description: 還有其他可能的做法嗎？為什麼選擇上述方案？

  - type: textarea
    id: scope
    attributes:
      label: 🎯 影響範圍
      description: 此功能影響哪些模組、使用者、流程？
      value: |
        - 影響模組：
        - 影響使用者：
        - 影響現有流程：

  - type: dropdown
    id: priority
    attributes:
      label: ⚡ 優先級
      options:
        - 🔴 P0（阻塞業務，須立即處理）
        - 🟠 P1（重要，下次迭代處理）
        - 🟡 P2（一般，排程後處理）
        - 🟢 P3（Nice to have，有空再處理）
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 驗收條件
      description: 怎樣才算「完成」？
      placeholder: |
        - [ ] 可選日期區間
        - [ ] 可篩選客戶代號
        - [ ] 支援 Excel 與 MIG XML 兩種格式
        - [ ] 匯出耗時不超過 30 秒（2000 筆）

  - type: textarea
    id: mockup
    attributes:
      label: 🎨 設計稿 / 草圖
      description: 如有 UI 變更，請附上設計稿或手繪草圖（拖曳圖片到此）

  - type: textarea
    id: additional
    attributes:
      label: 📎 其他資訊
      description: 補充資料、參考連結、競品分析等

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ 提交前確認
      options:
        - label: 我已搜尋過 [Issues](../issues) 確認此功能未被提出
          required: true
        - label: 我已說明清楚要解決的問題（而非僅描述解決方案）
          required: true
